<!doctype html>
<html lang="en" data-theme="control-room">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SQL-Optima Studio — SCADA Query Profiler &amp; Performance Tuning Hub</title>
  <meta name="description" content="Offline-first PWA: SQL query profiler, execution-plan analyzer, script workbench, BOM costing and QHSE checklists for SCADA historian engineers.">
  <meta name="theme-color" content="#070b11">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="SQL-Optima">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SQL-Optima">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph & Social Cards -->
  <meta property="og:title" content="SQL-Optima Studio — SCADA Query Profiler &amp; Tuning Hub">
  <meta property="og:description" content="Offline-first SQL query profiler, execution plan simulator, and automation script workbench for industrial SCADA engineers.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://githubbest729.github.io/SQL-Optima-Studio/">
  <meta property="og:image" content="icon.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SQL-Optima Studio">
  <meta name="twitter:description" content="Industrial SCADA SQL profiler &amp; performance tuning hub.">
  <meta name="twitter:image" content="icon.svg">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">

  <!-- Tailwind CSS v4 Browser Build bridge & enhanced control-room preloader styles -->
  <style type="text/tailwindcss">
    @theme {
      --color-accent: var(--accent);
      --color-surface: var(--surface-solid);
      --color-dim: var(--text-dim);
      --font-sans: var(--font-sans);
      --font-mono: var(--font-mono);
    }
  </style>
  <style>
    /* Inline Critical Polish & Smooth Rendering */
    :root {
      color-scheme: dark;
    }
    body {
      background-color: #070b11;
      overflow-x: hidden;
    }
    /* Skeleton Loading State Enhancement */
    .skeleton-hero {
      position: relative;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(18, 26, 38, 0.7), rgba(11, 16, 24, 0.5));
      border: 1px solid rgba(148, 170, 196, 0.15);
      backdrop-filter: blur(16px);
      padding: 32px 24px;
      overflow: hidden;
    }
    .skeleton-hero::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.08), transparent);
      animation: shimmer 1.8s infinite;
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#/dashboard" aria-label="SQL-Optima Studio home">
        <span id="brandLogo">
          <!-- Fallback inline brand icon before JS hydration -->
          <svg class="logo" width="36" height="36" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#34d399"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="14" fill="#0f1420" stroke="rgba(148, 170, 196, 0.3)"/>
            <g fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="32" cy="18" rx="15" ry="6"/>
              <path d="M17 18v14c0 3.3 6.7 6 15 6s15-2.7 15-6V18"/>
              <path d="M17 32v10c0 3.3 6.7 6 15 6s15-2.7 15-6V32"/>
            </g>
            <path d="M20 44l8-8 6 5 10-12" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">SQL-Optima</span>
          <span class="brand-sub">Studio · SCADA tuning hub</span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <div class="sector-chip" id="sectorChip">
          <span>Industry profile</span><b>District Cooling</b>
        </div>
        <button class="btn btn-ghost collapse-btn" id="collapseBtn" type="button" aria-label="Collapse sidebar">
          <span class="collapse-label">Collapse</span>
        </button>
      </div>
    </aside>
    
    <div class="scrim-nav" id="scrimNav"></div>

    <div class="shell">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumbs">
          <a class="crumb-root" href="#/dashboard">Studio</a>
          <span class="sep" aria-hidden="true">/</span>
          <b aria-current="page">Dashboard</b>
        </nav>

        <button class="search-btn" id="searchBtn" type="button" aria-label="Open command palette">
          <span id="searchIco">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          </span>
          <span>Search or run a command…</span>
          <kbd id="kbdHint">Ctrl K</kbd>
        </button>

        <div class="row items-center" style="gap: 8px;">
          <button class="btn btn-ghost btn-icon" id="themeBtn" type="button" aria-label="Cycle colour theme" title="Cycle theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 0 18c1.3 0 2-.8 2-1.8 0-1-.9-1.4-.9-2.4 0-.9.7-1.6 1.7-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/></svg>
          </button>
          <button class="btn btn-primary hide" id="installBtn" type="button" aria-label="Install App"></button>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <div id="view" class="view-enter">
          <div class="skeleton-hero">
            <div class="skeleton" style="height: 32px; width: 45%; margin-bottom: 16px; border-radius: 8px;"></div>
            <div class="skeleton" style="height: 18px; width: 75%; margin-bottom: 12px; border-radius: 6px;"></div>
            <div class="skeleton" style="height: 18px; width: 60%; margin-bottom: 24px; border-radius: 6px;"></div>
            <div class="row" style="gap: 12px;">
              <div class="skeleton" style="height: 42px; width: 140px; border-radius: 10px;"></div>
              <div class="skeleton" style="height: 42px; width: 150px; border-radius: 10px;"></div>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer" id="footer"></footer>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#070b11;color:#f8fafc;z-index:99999;font-family:sans-serif;padding:24px;text-align:center;">
      <div style="max-width:480px;background:#121a26;padding:32px;border-radius:16px;border:1px solid rgba(148,170,196,0.3);">
        <h2 style="margin-top:0;color:#38bdf8;">JavaScript Required</h2>
        <p style="color:#a3b3c6;line-height:1.6;">SQL-Optima Studio is an offline-capable SCADA profiler that requires JavaScript for off-thread query simulation and local storage.</p>
        <p style="color:#fbbf24;font-size:0.9rem;">Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </div>
  </noscript>

  <!-- Core Scripts (Flat Path Integration) -->
  <script src="icons.js"></script>
  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
