<!doctype html>
<html lang="en" data-theme="control-room">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SQL-Optima Studio — SCADA Query Profiler &amp; Performance Tuning Hub</title>
  <meta name="description" content="Offline-first PWA: SQL query profiler, execution-plan analyzer, script workbench, BOM costing and QHSE checklists for SCADA historian engineers.">
  <meta name="theme-color" content="#070b11">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="SQL-Optima">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SQL-Optima">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="SQL-Optima Studio">
  <meta property="og:description" content="Query profiler, tuning hub and script workbench for SCADA engineers.">
  <meta property="og:type" content="website">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Tailwind CSS v4 (browser build). Progressive enhancement: the app's core UI lives in css/styles.css
       and works fully offline even if this CDN script has never been cached. Theme tokens are bridged
       so utilities such as bg-accent / text-dim can be used in extensions. -->
  <style type="text/tailwindcss">
    @theme {
      --color-accent: var(--accent);
      --color-surface: var(--surface-solid);
      --color-dim: var(--text-dim);
      --font-sans: var(--font-sans);
      --font-mono: var(--font-mono);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#/dashboard" aria-label="SQL-Optima Studio home">
        <span id="brandLogo"></span>
        <span class="brand-text"><span class="brand-name">SQL-Optima</span><span class="brand-sub">Studio · SCADA tuning hub</span></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <div class="sector-chip" id="sectorChip"></div>
        <button class="btn btn-ghost collapse-btn" id="collapseBtn" type="button" aria-label="Collapse sidebar"></button>
      </div>
    </aside>
    <div class="scrim-nav" id="scrimNav"></div>

    <div class="shell">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar"></button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <button class="search-btn" id="searchBtn" type="button" aria-label="Open command palette">
          <span id="searchIco"></span><span>Search or run a command…</span><kbd id="kbdHint">Ctrl K</kbd>
        </button>
        <button class="btn btn-ghost btn-icon" id="themeBtn" type="button" aria-label="Cycle colour theme" title="Cycle theme"></button>
        <button class="btn btn-primary hide" id="installBtn" type="button"></button>
      </header>

      <main id="main" tabindex="-1">
        <div id="view" class="view-enter">
          <div class="skeleton" style="height:180px"></div>
        </div>
      </main>

      <footer class="footer" id="footer"></footer>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <noscript><p style="padding:24px;color:#fff;background:#111">SQL-Optima Studio needs JavaScript enabled.</p></noscript>

  <script src="js/icons.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
