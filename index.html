<!doctype html>
<html lang="en" data-theme="control-room">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SQL-Optima Studio — Industrial SCADA &amp; Historian Tuning Hub</title>
  <meta name="description" content="Industrial SCADA engineering productivity workbench for AVEVA Historian, TimescaleDB, MS SQL Server, EEMUA 191 alarm analysis, and PLC code verification.">
  <meta name="theme-color" content="#070b11">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="SQL-Optima Studio">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SQL-Optima">

  <!-- Open Graph -->
  <meta property="og:title" content="SQL-Optima Studio — SCADA Query Profiler &amp; Historian Tuning Hub">
  <meta property="og:description" content="Industrial engineering platform for SCADA database optimization and PLC automation.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icon.svg">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">

  <!-- Production Client-Side Libraries: SheetJS (XLSX) & jsPDF with autoTable Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <div class="app" id="app">
    <!-- Collapsible Industrial Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Main Navigation">
      <div class="brand">
        <a href="#/dashboard" class="brand-link" aria-label="SQL-Optima Studio Home">
          <span id="brandLogo"></span>
          <div class="brand-text">
            <span class="brand-name">SQL-Optima</span>
            <span class="brand-sub">SCADA Tuning Hub</span>
          </div>
        </a>
      </div>

      <nav class="nav" id="nav" aria-label="Primary Navigation"></nav>

      <div class="sidebar-foot">
        <div class="mode-badge" id="appModeBadge" title="Operational Data Mode">
          <span class="dot warn" id="gatewayStatusDot"></span>
          <div class="mode-info">
            <span class="mode-lbl">DATA LINK</span>
            <strong class="mode-val" id="gatewayStatusTxt">OFFLINE / SIMULATED</strong>
          </div>
        </div>
        <div class="sector-chip" id="sectorChip"></div>
        <button class="btn btn-ghost collapse-btn" id="collapseBtn" type="button" aria-label="Toggle Sidebar" aria-expanded="true">
          <span id="collapseIcon"></span>
          <span class="collapse-label">Collapse</span>
        </button>
      </div>
    </aside>

    <div class="scrim-nav" id="scrimNav"></div>

    <!-- Main Application Shell -->
    <div class="shell">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn" type="button" aria-label="Open Navigation Menu" aria-controls="sidebar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb Navigation"></nav>

        <div class="topbar-search">
          <button class="search-btn" id="searchBtn" type="button" aria-label="Open Command Palette">
            <span id="searchIco"></span>
            <span class="search-placeholder">Quick Command Palette…</span>
            <kbd id="kbdHint">Ctrl K</kbd>
          </button>
        </div>

        <!-- Help & Guide Button for Non-Technical Users -->
        <button class="btn btn-ghost" id="topbarHelpBtn" onclick="window.openGuideModal ? window.openGuideModal(location.hash.replace('#/', '')) : null" style="gap:6px; font-size:0.85rem; padding: 6px 12px; margin-left: 8px; border: 1px solid var(--border, #2a3b53); border-radius: 6px;">
          📖 Help &amp; Guide
        </button>

        <div class="topbar-actions">
          <div class="live-pill" id="livePill" title="Operational Mode Indicator">
            <span class="dot pulse-warn" id="topbarPillDot"></span>
            <span id="topbarPillTxt">SIMULATED SCADA LINK</span>
          </div>
          <button class="btn btn-ghost btn-icon" id="themeBtn" type="button" aria-label="Cycle UI Theme" title="Cycle UI Theme"></button>
          <button class="btn btn-primary hide" id="installBtn" type="button" aria-label="Install Desktop/Mobile PWA"></button>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <div id="view" class="view-enter">
          <div class="skeleton-hero">
            <div class="skeleton" style="height: 32px; width: 35%; margin-bottom: 16px; border-radius: 8px;"></div>
            <div class="skeleton" style="height: 18px; width: 65%; margin-bottom: 12px; border-radius: 6px;"></div>
            <div class="skeleton" style="height: 18px; width: 50%; margin-bottom: 24px; border-radius: 6px;"></div>
          </div>
        </div>
      </main>

      <footer class="footer" id="footer"></footer>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript-banner">
      <h2>JavaScript Required</h2>
      <p>SQL-Optima Studio requires JavaScript enabled for offline query simulation, IndexedDB persistence, and telemetry rendering.</p>
    </div>
  </noscript>

  <!-- Modular Scripts -->
  <script src="icons.js"></script>
  <script src="components.js"></script>
  <script src="js/trend-engine.js"></script>
  <script src="js/alarm-engine.js"></script>
  <script src="js/st-parser.js"></script>
  <script src="js/python-linter.js"></script>
  <script src="js/report-generator.js"></script>
  <script src="js/help-guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
