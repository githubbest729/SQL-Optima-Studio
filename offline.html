<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline — SQL-Optima Studio</title>
  <meta name="theme-color" content="#070b11">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#070b11; --surface:#121a26; --border:rgba(148,170,196,.3); --text:#e8eef6; --dim:#a3b3c6; --accent:#38bdf8; --warn:#fbbf24; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; }
    body {
      display: grid; place-items: center; text-align: center;
      padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text);
      background: radial-gradient(800px 480px at 15% -10%, rgba(56,189,248,.12), transparent 60%), var(--bg);
    }
    main { width: min(520px, 100%); padding: 32px 24px; border: 1px solid var(--border); border-radius: 20px; background: rgba(18,26,38,.7); backdrop-filter: blur(18px); }
    .ico { width: 64px; height: 64px; margin: 0 auto 16px; color: var(--warn); }
    h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -.02em; }
    p { margin: 0 0 20px; color: var(--dim); }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 20px; border-radius: 10px; font: 650 15px/1 inherit; text-decoration: none; cursor: pointer; }
    .primary { background: linear-gradient(135deg, #38bdf8, #22d3ee); color: #031018; border: 0; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    small { display: block; margin-top: 20px; color: var(--dim); }
  </style>
</head>
<body>
  <main role="main">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 3l18 18"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M5.5 12.5a9.5 9.5 0 0 1 4-2.3M14 10.4a9.5 9.5 0 0 1 4.5 2.1"/><path d="M2.5 9a14 14 0 0 1 4.3-2.8M11 5.1A14 14 0 0 1 21.5 9"/><path d="M12 19.5h.01"/>
    </svg>
    <h1>You’re offline</h1>
    <p>This page isn’t in the cache yet. Your saved queries, scripts, BOM and checklists are stored on this device — open the app to keep working without a network.</p>
    <div class="row">
      <a class="primary" href="./">Open SQL-Optima</a>
      <button class="ghost" type="button" onclick="location.reload()">Try again</button>
    </div>
    <small>Control-room tip: open the app once while online so the service worker can cache everything.</small>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
